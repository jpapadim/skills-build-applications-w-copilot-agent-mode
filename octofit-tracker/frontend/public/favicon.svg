<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Dynamic gradient background circle -->
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="64" cy="64" r="60" fill="url(#faviconGrad)"/>
  
  <!-- Octopus body in action pose -->
  <ellipse cx="64" cy="48" rx="24" ry="26" fill="white"/>
  
  <!-- Head -->
  <circle cx="64" cy="32" r="16" fill="white"/>
  
  <!-- Eyes - dynamic -->
  <circle cx="56" cy="28" r="4" fill="#667eea"/>
  <circle cx="72" cy="28" r="4" fill="#667eea"/>
  <circle cx="56" cy="29" r="2" fill="#333"/>
  <circle cx="72" cy="29" r="2" fill="#333"/>
  <circle cx="55" cy="27" r="1" fill="white"/>
  <circle cx="71" cy="27" r="1" fill="white"/>
  
  <!-- Smile -->
  <path d="M 58 36 Q 64 38 70 36" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Tentacles in action -->
  <!-- Left flexing tentacle -->
  <path d="M 48 68 Q 38 72 35 85 Q 33 95 38 105" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="38" cy="105" r="3.5" fill="#ffeb3b"/>
  
  <!-- Left-center -->
  <path d="M 54 72 Q 48 82 48 98" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="48" cy="98" r="3.5" fill="#ffeb3b"/>
  
  <!-- Center - thrust up -->
  <path d="M 64 74 Q 62 88 66 104" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="66" cy="104" r="3.5" fill="white"/>
  
  <!-- Right-center -->
  <path d="M 74 72 Q 80 82 80 98" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="80" cy="98" r="3.5" fill="#ffeb3b"/>
  
  <!-- Right flexing tentacle -->
  <path d="M 80 68 Q 90 72 93 85 Q 95 95 90 105" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="90" cy="105" r="3.5" fill="#ffeb3b"/>
  
  <!-- Fitness heart -->
  <path d="M 64 54 L 68 58 L 64 62 L 60 58 Z" fill="#ffeb3b"/>
  
  <!-- Energy lines -->
  <line x1="92" y1="45" x2="110" y2="35" stroke="#ffeb3b" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="36" y1="45" x2="18" y2="35" stroke="#ffeb3b" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
</svg>
