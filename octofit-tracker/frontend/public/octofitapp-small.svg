<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- Dynamic gradient background -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Octopus body in action pose -->
  <ellipse cx="100" cy="75" rx="38" ry="42" fill="url(#bodyGrad)"/>
  
  <!-- Octopus head details -->
  <circle cx="100" cy="55" r="25" fill="#667eea"/>
  
  <!-- Eyes - dynamic expression -->
  <circle cx="88" cy="48" r="7" fill="white"/>
  <circle cx="112" cy="48" r="7" fill="white"/>
  <circle cx="88" cy="50" r="4" fill="#333"/>
  <circle cx="112" cy="50" r="4" fill="#333"/>
  <circle cx="86" cy="48" r="2" fill="white"/>
  <circle cx="110" cy="48" r="2" fill="white"/>
  
  <!-- Smile -->
  <path d="M 92 60 Q 100 65 108 60" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Flexing tentacle 1 (bicep curl pose) -->
  <path d="M 70 110 Q 55 115 50 140 Q 48 160 52 180" stroke="#764ba2" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="52" cy="180" r="6" fill="#ffeb3b"/>
  <!-- Muscle highlight -->
  <path d="M 60 118 Q 55 120 52 125" stroke="#ffeb3b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Action tentacle 2 (running/jumping) -->
  <path d="M 82 115 Q 75 125 72 155 Q 70 180 78 205" stroke="#667eea" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="78" cy="205" r="6" fill="#ffeb3b"/>
  
  <!-- Center tentacle (up thrust) -->
  <path d="M 100 118 Q 98 130 102 165 Q 105 190 100 215" stroke="#764ba2" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="100" cy="215" r="6" fill="white"/>
  
  <!-- Action tentacle 4 (extended reach) -->
  <path d="M 118 115 Q 125 125 128 155 Q 130 180 122 205" stroke="#667eea" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="122" cy="205" r="6" fill="#ffeb3b"/>
  
  <!-- Flexing tentacle 5 (power pose) -->
  <path d="M 130 110 Q 145 115 150 140 Q 152 160 148 180" stroke="#764ba2" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="148" cy="180" r="6" fill="#ffeb3b"/>
  <!-- Muscle highlight -->
  <path d="M 140 118 Q 145 120 148 125" stroke="#ffeb3b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Fitness heart symbol on chest -->
  <path d="M 100 85 L 106 91 L 100 97 L 94 91 Z" fill="#ffeb3b" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
  
  <!-- Energy/motion lines -->
  <line x1="140" y1="70" x2="165" y2="60" stroke="#ffeb3b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="145" y1="85" x2="175" y2="80" stroke="#ffeb3b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="60" y1="70" x2="35" y2="60" stroke="#ffeb3b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="55" y1="85" x2="25" y2="80" stroke="#ffeb3b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
